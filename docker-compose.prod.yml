services:
  backend:
    build:
      context: ./backend
    env_file: .env.production
    volumes:
      - timizer-db:/app/var
      - timizer-assets:/app/assets
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  timizer-db:
  timizer-assets:
